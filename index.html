<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App Hub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .hub-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 { margin-top: 0; color: #1f2937; }
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .app-link {
            display: block;
            padding: 15px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .app-link:hover {
            background: #1d4ed8;
        }
        .app-link.secondary {
            background: #4b5563;
        }
        .app-link.secondary:hover {
            background: #374151;
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <h1>My App Directory</h1>
        <p>Select an application or page below:</p>
        
        <div class="links-list">
            <!-- Relative links to your other HTML files -->
            <a href="GPS_Calc.html" class="app-link">📋 Open GPS Calculator</a>
            <a href="radar-power-budget_Calc.html" class="app-link secondary">Open RF dBm Calculator</a>
        </div>
    </div>

</body>
</html>
